smart_clean = true
smart_clean_threshold = 3
version = 6

[[custom_processors.preprocessors]]
cli_args = ["-t", "html5"]
name = "HTML"

[[custom_processors.preprocessors]]
cli_args = ["-f", "markdown+inline_code_attributes", "-t", "html5"]
extension_filter = "md"
name = "HTML from Markdown"

[[custom_processors.preprocessors]]
cli = "cat"
cli_args = []
extension_filter = "html"
name = "HTML Direct"

[[custom_processors.preprocessors]]
cli_args = ["-f", "markdown+inline_code_attributes", "-t", "html5"]
extension_filter = "md"
name = "HTML from Markdown"

[[custom_processors.preprocessors]]
cli_args = ["-f", "markdown+inline_code_attributes", "-t", "html5"]
extension_filter = "mdl"
name = "MDL Headers"

[[custom_processors.preprocessors]]
cli_args = ["-f", "markdown", "-t", "html5"]
extension_filter = "xmltemplate"
name = "Sitemap"

[[custom_processors.preprocessors]]
cli = "true"
cli_args = []
extension_filter = "typign_md"
ignore = true
name = "Typst Ignore MD Ignored"

[[custom_processors.preprocessors]]
cli_args = ["-f", "markdown+inline_code_attributes", "-t", "html5"]
extension_filter = "typign_md"
name = "Typst Ignore MD Processed"

[[custom_processors.preprocessors]]
cli = "true"
cli_args = []
extension_filter = "typ"
ignore = true
name = "Ignore Typst for Web"

[[custom_processors.processors]]
name = "TypstFonts"
processor_args = ["--font-path", "fonts"]

[[injections]]
files = ["custom-tail.html"]
name = "HTML Tail Injection"

[[injections]]
files = ["custom-head-1.html", "custom-head-headers.mdl", "custom-head-2.html", "custom-nav.mdl"]
name = "HTML Head Injection Split"

[[markdown_projects]]
default_profile = "Website"
name = "Markdown"
output = "."
path = "Markdown"

[[markdown_projects]]
default_profile = "Documentation"
name = "Documentation"
output = "web/docs"
path = "Documentation"
resources = ["resources/"]

[markdown_projects.metadata_fields]
base_path = "docs/web"

[[markdown_projects]]
default_profile = "Sitemap"
name = "Sitemap"
output = "."
path = "Sitemap"

[[profiles]]
name = "Website"
templates = ["HTML"]

[[profiles]]
name = "Documentation"
templates = ["HTML", "PDF"]

[[profiles]]
name = "Sitemap"
templates = ["Sitemap"]

[[templates]]
filters = ["luafilters/sitemapfilter/sitemap_filter.lua"]
multi_file_output = true
name = "Sitemap"
output = "web"
template_type = "CustomPreprocessors"

[templates.meta_gen]
feature = "Full"

[templates.preprocessors]
output_extension = "xml"
preprocessors = ["Sitemap"]

[[templates]]
filters = ["luafilters/megareplacerfilter/mega_replacer_filter.lua", "luafilters/navfilter/nav_filter.lua", "luafilters/changelogfilter/changelog_filter.lua", "luafilters/docsindexfilter/docs_index_filter.lua", "luafilters/tocfilter/toc_filter.lua", "luafilters/lazyimagefilter/lazy_image_filter.lua"]
footer_injections = ["HTML Tail Injection"]
header_injections = ["HTML Head Injection Split"]
multi_file_output = true
name = "HTML"
output = "web"
template_type = "CustomPreprocessors"

[templates.meta_gen]
feature = "Full"
format = "Json"

[templates.preprocessors]
output_extension = "html"
preprocessors = ["HTML Direct", "HTML from Markdown", "HTML", "MDL Headers", "Typst Ignore MD Processed", "Ignore Typst for Web"]

[[templates]]
filters = ["luafilters/megareplacerfilter/mega_replacer_filter.lua", "luafilters/typstpathfilter/typst_path_filter.lua"]
name = "PDF"
output = "bundle.pdf"
processor = "TypstFonts"
template_file = "bundle.typ"
template_type = "Typst"

[templates.meta_gen]
feature = "NavOnly"

[templates.preprocessors]
preprocessors = ["Typst Ignore MD Ignored"]
