    <style>
      @font-face {
        font-family: Audiowide;
        src: url("/fonts/Audiowide-Regular.ttf");
      }
      
      @font-face {
        font-family: Exo;
        src: url("/fonts/Exo-VariableFont_wght.ttf");
        font-style: normal;
      }

      @font-face {
        font-family: Exo;
        src: url("/fonts/Exo-Italic-VariableFont_wght.ttf");

      }

      .prem-font {
        font-family: Audiowide;
      }

      h1,h2,h3,h4,h5,h6 {
        font-family: Exo;
      }

        font-family: Exo;
      }
      
      .feature-card:hover {
        cursor: pointer;
        background: color-mix(in srgb, var(--bs-teal) 40%, white 60%);
        transition: all ease-in-out 200ms;
      }

      .feature-card {
        color: black;
        text-decoration: none;
