    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('tp-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-bs-theme', t);
      })();
    </script>

    <script>
      // Apply teleprompter (fun) mode before paint so the mirrored, big-type
      // framing never flashes in/out. See js/fun.js for the toggle + scroll.
      (function () {
        var f, m;
        try {
          f = localStorage.getItem('tp-fun');
          m = localStorage.getItem('tp-fun-mirror');
        } catch (e) {}
        if (f !== 'on') return;
        var root = document.documentElement;
        root.setAttribute('data-fun', 'on');
        if (m !== 'off') root.setAttribute('data-fun-mirror', '');
      })();
    </script>

    <script>
      // Pick a random TiefPrompt face for the brand on each page load. Runs in
      // <head> so --brand-font is set before the navbar paints (no flash).
      (function () {
        var fonts = ['Roboto', '"Roboto Mono"', '"Roboto Slab"', '"OpenDyslexic"'];
        var pick = fonts[Math.floor(Math.random() * fonts.length)];
        document.documentElement.style.setProperty('--brand-font', pick);
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/swiper-bundle.min.css"/>

    <style>
      @font-face {
        font-family: Audiowide;
        src: url("/fonts/Audiowide-Regular.ttf");
      }

      @font-face {
        font-family: Exo;
        src: url("/fonts/Exo-VariableFont_wght.ttf");
        font-style: normal;
      }

      @font-face {
        font-family: Exo;
        src: url("/fonts/Exo-Italic-VariableFont_wght.ttf");
        font-style: italic;
      }

      /* TiefPrompt's own type family, cycled randomly on the brand per load. */
      @font-face {
        font-family: "Roboto";
        src: url("/fonts/Roboto-VariableFont_wdth,wght.ttf");
      }

      @font-face {
        font-family: "Roboto Mono";
        src: url("/fonts/RobotoMono-VariableFont_wght.ttf");
      }

      @font-face {
        font-family: "Roboto Slab";
        src: url("/fonts/RobotoSlab-VariableFont_wght.ttf");
      }

      @font-face {

      h1,h2,h3,h4,h5,h6 {

      }

      .shield-button {
        height: 40px
      }

      @media (min-width: 992px) {
        .shield-button {
          height: 35px
        }
      }
    </style>
